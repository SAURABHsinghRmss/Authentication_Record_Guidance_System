version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: eduidentity_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: eduidentity_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d eduidentity_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: valkey/valkey:7.2-alpine
    container_name: eduidentity_cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
